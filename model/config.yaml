base_model: HuggingFaceTB/SmolLM2-135M-Instruct
output_dir: artifacts/synxo-nano
train_file: model/data/train.jsonl
validation_file: model/data/validation.jsonl
seed: 42
max_seq_length: 1024
num_train_epochs: 3
learning_rate: 0.0002
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.05
weight_decay: 0.01
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
load_best_model_at_end: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
